name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test, build and validate HUD package
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Test Creator uploader without credentials or network access
        run: python3 -m unittest discover -s tests/upload -v
      - name: Verify release guards without publishing
        shell: pwsh
        run: |
          $manifest = Get-Content src/BasicHud/hud.json -Raw | ConvertFrom-Json
          ./scripts/Test-ReleaseGuards.ps1 -ExpectedId sou-basic-wasm -ManifestPath src/BasicHud/hud.json -PackagePath "artifacts/$($manifest.id)-$($manifest.version).souhud"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sou-basic-wasm
          path: |
            artifacts/*.souhud
            artifacts/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.repository == 'getsOU/HUD-WASM' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this build's verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sou-basic-wasm
          path: release-artifacts
      - name: Verify and publish immutable release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Publish-Release.ps1 -ExpectedId sou-basic-wasm -ManifestPath src/BasicHud/hud.json

  upload-sou:
    if: github.repository == 'getsOU/HUD-WASM' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/upload-sou.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      SOU_CREATOR_API_KEY: ${{ secrets.SOU_CREATOR_API_KEY }}
